name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, build and publish
    runs-on: ubuntu-22.04

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Validate version and prepare assets
        shell: bash
        run: |
          if [[ "$(git cat-file -t "${GITHUB_REF_NAME}")" != tag ]]; then
            echo "Release tags must be annotated tags" >&2
            exit 1
          fi

          source_date_epoch="$(git show -s --format=%ct "${GITHUB_REF_NAME}^{}")"
          python3 scripts/prepare_release.py \
            --tag "${GITHUB_REF_NAME}" \
            --target x86_64-unknown-linux-gnu \
            --binary target/x86_64-unknown-linux-gnu/release/wlapse \
            --output-dir dist \
            --mtime "${source_date_epoch}"
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease=(--prerelease --latest=false)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.xz \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "wlapse ${GITHUB_REF_NAME#v}" \
            "${prerelease[@]}"
