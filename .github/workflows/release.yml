name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Download AppImage tooling
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          printf '%s  %s\n' \
            'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0' \
            'appimagetool-x86_64.AppImage' | sha256sum --check
          chmod +x appimagetool-x86_64.AppImage

          curl --fail --location --retry 3 \
            --header 'Accept: application/octet-stream' \
            --output runtime-x86_64 \
            https://api.github.com/repos/AppImage/type2-runtime/releases/assets/456065460
          printf '%s  %s\n' \
            '1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf' \
            'runtime-x86_64' | sha256sum --check

      - name: Validate version and prepare assets
        shell: bash
        run: |
          if [[ "$(git cat-file -t "${GITHUB_REF_NAME}")" != tag ]]; then
            echo "Release tags must be annotated tags" >&2
            exit 1
          fi

          source_date_epoch="$(git show -s --format=%ct "${GITHUB_REF_NAME}^{}")"
          python3 scripts/prepare_release.py \
            --tag "${GITHUB_REF_NAME}" \
            --target x86_64-unknown-linux-gnu \
            --binary target/x86_64-unknown-linux-gnu/release/wlapse \
            --output-dir dist \
            --mtime "${source_date_epoch}"
          python3 scripts/build_appimage.py \
            --version "${GITHUB_REF_NAME#v}" \
            --binary target/x86_64-unknown-linux-gnu/release/wlapse \
            --appimagetool appimagetool-x86_64.AppImage \
            --runtime runtime-x86_64 \
            --output-dir dist
          (cd dist && sha256sum ./*.tar.xz ./*.AppImage > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Smoke test AppImage
        shell: bash
        run: |
          appimage="dist/wlapse-v${GITHUB_REF_NAME#v}-x86_64.AppImage"
          version_output="$(APPIMAGE_EXTRACT_AND_RUN=1 "${appimage}" --version)"
          test "${version_output}" = "wlapse ${GITHUB_REF_NAME#v}"

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist

      - name: Publish GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease=(--prerelease --latest=false)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.xz \
            dist/*.AppImage \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "wlapse ${GITHUB_REF_NAME#v}" \
            "${prerelease[@]}"
